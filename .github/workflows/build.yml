name: Build D3D9 Probe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build x86 DLL
        run: msbuild RADLER.D3D9Probe.vcxproj /p:Configuration=Release /p:Platform=Win32
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: RADLER-D3D9-Probe-x86
          path: Release/RADLER.D3D9Probe.dll
